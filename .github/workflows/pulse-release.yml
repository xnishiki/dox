name: Pulse — сборка .exe

# Когда запускается:
#  • пуш в ветку pulse — собирает установщик и portable-версию и кладёт их в ветку pulse-dist
#    (файлы разбиты на части по 40 МБ — лимит GitHub на файл 100 МБ; склеить: см. README);
#  • пуш тега вида v0.2.0 — то же самое плюс прикрепляет .exe к GitHub Release;
#  • вручную: Actions → «Pulse — сборка .exe» → Run workflow.
on:
  push:
    branches: [pulse]
    tags: ['v*']
    paths: ['pulse/**', '.github/workflows/pulse-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pulse
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulse/package-lock.json

      - name: Установка зависимостей
        run: set -o pipefail; npm ci --no-audit --no-fund 2>&1 | tee -a "$(cygpath -u "$RUNNER_TEMP")/build.log"

      - name: Проверка типов
        run: set -o pipefail; npm run typecheck 2>&1 | tee -a "$(cygpath -u "$RUNNER_TEMP")/build.log"

      - name: Сборка .exe
        env:
          # Ключи по желанию: Settings → Secrets and variables → Actions.
          # Без них приложение соберётся, а ключи можно будет вписать в его настройках.
          VITE_JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: set -o pipefail; npm run dist 2>&1 | tee -a "$(cygpath -u "$RUNNER_TEMP")/build.log"

      - name: Список файлов
        run: ls -la release/*.exe && cd release && sha256sum *.exe | tee "$(cygpath -u "$RUNNER_TEMP")/SHA256SUMS"

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-windows
          path: pulse/release/*.exe
          if-no-files-found: error

      - name: Выложить в ветку pulse-dist
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          T="$(cygpath -u "$RUNNER_TEMP")"
          OUT="$T/dist"
          rm -rf "$OUT" && mkdir -p "$OUT"
          for f in release/*.exe; do
            split -b 40m -d -a 2 "$f" "$OUT/$(basename "$f").part"
          done
          cp "$T/SHA256SUMS" "$OUT/"
          printf 'status=success\ncommit=%s\nbuilt=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$OUT/BUILD_INFO"
          cd "$OUT"
          git init -q -b pulse-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pulse build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:pulse-dist

      - name: Выложить лог ошибки в ветку pulse-dist
        if: failure() && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          OUT="$T/faillog"
          rm -rf "$OUT" && mkdir -p "$OUT"
          tail -c 200000 "$T/build.log" > "$OUT/build.log" 2>/dev/null || echo "лог пуст" > "$OUT/build.log"
          printf 'status=failure\ncommit=%s\nbuilt=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$OUT/BUILD_INFO"
          cd "$OUT"
          git init -q -b pulse-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pulse build FAILED ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:pulse-dist

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pulse/release/*.exe
          generate_release_notes: true
